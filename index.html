<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סימולטור מולקולות</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b7566">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="מולקולות">
<meta name="description" content="סימולטור כימיה בעברית: מקלידים שם של מולקולה, אטום או יון ורואים מודל תלת־ממדי, מבנה לואיס ונתונים.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lab bench sheet. Search on top, the species name as headline, model + Lewis side by side, data table below. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#13232b; --muted:#566a73; --line:#d3dcdb;
  --accent:#0b7566; --accent-soft:#d9efeb; --warn:#9a5a00; --bond:#7d8b91;
  --display:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1619; --surface:#162127; --ink:#e4eded; --muted:#93a6ab; --line:#2a3a40;
    --accent:#56d3bd; --accent-soft:#173a36; --warn:#f0b35a; --bond:#8a999f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#162127; --ink:#e4eded; --muted:#93a6ab; --line:#2a3a40;
  --accent:#56d3bd; --accent-soft:#173a36; --warn:#f0b35a; --bond:#8a999f;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;text-wrap:balance}
.lead{margin:2px 0 0;color:var(--muted);font-size:16px}
form{display:flex;gap:8px}
#q{text-align:right;flex:1;min-width:0;font:inherit;font-size:18px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#q:focus-visible,button:focus-visible,.chip:focus-visible,input[type=checkbox]:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
button.go{font:inherit;font-weight:700;padding:11px 20px;border:0;border-radius:10px;background:var(--accent);color:var(--surface);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{color:var(--muted);font-size:14px;margin-inline-end:2px}
.chip{font:inherit;font-size:15px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--accent)}
#status{min-height:1.4em;color:var(--muted);font-size:15px}
#status.err{color:var(--warn)}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-bottom:2px solid var(--ink);padding-bottom:10px}
.head h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
.head .formula{font-size:26px}
.pill{font-size:14px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.note{margin:0;color:var(--muted);font-size:15.5px;max-width:65ch}
.note.ai{color:var(--warn)}
.f{font-family:var(--mono);unicode-bidi:isolate;direction:ltr}
.f sub,.f sup{font-size:.68em;line-height:0}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:14px;font-weight:700;letter-spacing:.02em;color:var(--muted);margin:0}
#cv{width:100%;height:300px;display:block;touch-action:none;cursor:grab;border-radius:8px}
#cv:active{cursor:grabbing}
.ctrl{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted)}
.ctrl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.ctrl input{accent-color:var(--accent);width:17px;height:17px}
.cardhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cardhead h3{margin-inline-end:auto}
.zoom,.seg{display:flex;gap:4px}
.zoom button,.seg button{font:inherit;font-size:15px;min-width:36px;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer}
.zoom button{font-size:20px;line-height:1;padding:0}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.orb{display:flex;flex-wrap:wrap;gap:8px 16px}
.ob{display:inline-flex;align-items:center;font-family:var(--mono)}
.ob b{font-weight:600;font-size:14px;color:var(--muted);margin-right:6px}
.ob i{display:inline-flex;justify-content:center;align-items:center;width:30px;height:34px;border:1.5px solid var(--ink);font-style:normal;font-size:17px;letter-spacing:-3px;margin-left:-1.5px;color:var(--accent)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px}
.cap{font-size:14.5px;color:var(--muted);margin:0}
#lewis{touch-action:pan-x pan-y;display:flex;align-items:center;justify-content:safe center;min-height:300px;max-height:460px;overflow:auto}
#lewis svg{display:block;width:100%;height:auto;max-height:340px}
.lw-sym{fill:var(--ink);font:600 20px var(--mono);text-anchor:middle;dominant-baseline:central}
.lw-bond{stroke:var(--ink);stroke-width:1.9;stroke-linecap:round}
.lw-dot{fill:var(--accent)}
.lw-fc{fill:var(--warn);font:600 13px var(--mono);text-anchor:middle;dominant-baseline:central}
.lw-fcc{fill:none;stroke:var(--warn);stroke-width:1.1}
.lw-br{fill:none;stroke:var(--ink);stroke-width:1.9}
.lw-chg{fill:var(--ink);font:600 17px var(--mono);dominant-baseline:central}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted);margin:0;padding:0;list-style:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:baseline}
dl{display:grid;grid-template-columns:minmax(120px,34%) 1fr;margin:0;font-size:16px}
dt,dd{margin:0;padding:8px 2px;border-top:1px solid var(--line)}
dt{color:var(--muted)}
dd{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
dl>dt:first-of-type,dl>dt:first-of-type+dd{border-top:0}
dd ul{margin:0;padding:0;list-style:none}
footer{color:var(--muted);font-size:14px;max-width:70ch}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>סימולטור מולקולות</h1>
    <p class="lead">הקלידו שם של מולקולה, אטום או יון. בעברית, באנגלית או כנוסחה.</p>
  </header>

  <form id="search" autocomplete="off">
    <input id="q" type="text" dir="rtl" inputmode="text" placeholder="למשל: מים, CO2, אמוניום, Fe3+" aria-label="שם או נוסחה">
    <button class="go" type="submit" id="go">הצג</button>
  </form>
  <div class="chips" id="sugs"></div>
  <div id="status" role="status" aria-live="polite"></div>

  <section class="head">
    <h2 id="name"></h2>
    <span class="formula" id="formula"></span>
    <span class="pill" id="kind"></span>
  </section>
  <p class="note" id="note" hidden></p>
  <div class="chips" id="related" hidden></div>

  <div class="grid">
    <section class="card">
      <div class="cardhead"><h3 id="cvTitle">מודל תלת־ממדי</h3>
        <div class="seg" id="atomTabs" hidden><button type="button" data-m="bohr" aria-pressed="true">בוהר</button><button type="button" data-m="cloud" aria-pressed="false">אורביטלים</button></div>
        <div class="zoom"><button type="button" id="zOut" aria-label="הקטנת המודל">−</button><button type="button" id="zIn" aria-label="הגדלת המודל">+</button></div>
      </div>
      <div class="chips" id="subs" dir="ltr" hidden></div>
      <canvas id="cv" aria-label="מודל של החומר. גררו כדי לסובב."></canvas>
      <div class="ctrl" id="ctrl">
        <label><input type="checkbox" id="optLP" checked> זוגות לא קושרים</label>
        <label><input type="checkbox" id="optRot" checked> סיבוב אוטומטי</label>
      </div>
      <p class="cap" id="cvCap"></p>
    </section>
    <section class="card">
      <div class="cardhead"><h3>מבנה לואיס</h3>
        <div class="zoom"><button type="button" id="lzOut" aria-label="הקטנת מבנה לואיס">−</button><button type="button" id="lzIn" aria-label="הגדלת מבנה לואיס">+</button></div>
      </div>
      <div id="lewis" dir="ltr"></div>
      <ul class="legend" id="lwLegend"></ul>
    </section>
  </div>

  <section class="card" id="orbCard" hidden>
    <h3>דיאגרמת אורביטלים</h3>
    <div class="orb" id="orbBoxes" dir="ltr"></div>
    <p class="cap">כל משבצת היא אורביטל אחד, ובכל אורביטל עד שני אלקטרונים בספין הפוך. לפי כלל הונד, אורביטלים באותה תת־רמה מתמלאים קודם באלקטרון אחד כל אחד.</p>
  </section>

  <section class="card">
    <h3>נתונים</h3>
    <dl id="data"></dl>
  </section>

  <footer id="foot"></footer>
</div>

<script id="core">
/* ================= Elements ================= */
const EL_RAW="H|מימן|Hydrogen|1.008|2.20;He|הליום|Helium|4.0026|0;Li|ליתיום|Lithium|6.94|0.98;Be|בריליום|Beryllium|9.0122|1.57;B|בור|Boron|10.81|2.04;C|פחמן|Carbon|12.011|2.55;N|חנקן|Nitrogen|14.007|3.04;O|חמצן|Oxygen|15.999|3.44;F|פלואור|Fluorine|18.998|3.98;Ne|נאון|Neon|20.180|0;Na|נתרן|Sodium|22.990|0.93;Mg|מגנזיום|Magnesium|24.305|1.31;Al|אלומיניום|Aluminium|26.982|1.61;Si|צורן|Silicon|28.085|1.90;P|זרחן|Phosphorus|30.974|2.19;S|גופרית|Sulfur|32.06|2.58;Cl|כלור|Chlorine|35.45|3.16;Ar|ארגון|Argon|39.948|0;K|אשלגן|Potassium|39.098|0.82;Ca|סידן|Calcium|40.078|1.00;Sc|סקנדיום|Scandium|44.956|1.36;Ti|טיטניום|Titanium|47.867|1.54;V|ונדיום|Vanadium|50.942|1.63;Cr|כרום|Chromium|51.996|1.66;Mn|מנגן|Manganese|54.938|1.55;Fe|ברזל|Iron|55.845|1.83;Co|קובלט|Cobalt|58.933|1.88;Ni|ניקל|Nickel|58.693|1.91;Cu|נחושת|Copper|63.546|1.90;Zn|אבץ|Zinc|65.38|1.65;Ga|גליום|Gallium|69.723|1.81;Ge|גרמניום|Germanium|72.630|2.01;As|ארסן|Arsenic|74.922|2.18;Se|סלניום|Selenium|78.971|2.55;Br|ברום|Bromine|79.904|2.96;Kr|קריפטון|Krypton|83.798|3.00;Rb|רובידיום|Rubidium|85.468|0.82;Sr|סטרונציום|Strontium|87.62|0.95;Y|איטריום|Yttrium|88.906|1.22;Zr|זירקוניום|Zirconium|91.224|1.33;Nb|ניוביום|Niobium|92.906|1.6;Mo|מוליבדן|Molybdenum|95.95|2.16;Tc|טכנציום|Technetium|98|1.9;Ru|רותניום|Ruthenium|101.07|2.2;Rh|רודיום|Rhodium|102.91|2.28;Pd|פלדיום|Palladium|106.42|2.20;Ag|כסף|Silver|107.87|1.93;Cd|קדמיום|Cadmium|112.41|1.69;In|אינדיום|Indium|114.82|1.78;Sn|בדיל|Tin|118.71|1.96;Sb|אנטימון|Antimony|121.76|2.05;Te|טלור|Tellurium|127.60|2.1;I|יוד|Iodine|126.90|2.66;Xe|קסנון|Xenon|131.29|2.6;Cs|צסיום|Caesium|132.91|0.79;Ba|בריום|Barium|137.33|0.89;La|לנתן|Lanthanum|138.91|1.10;Ce|צריום|Cerium|140.12|1.12;Pr|פרסאודימיום|Praseodymium|140.91|1.13;Nd|נאודימיום|Neodymium|144.24|1.14;Pm|פרומתיום|Promethium|145|0;Sm|סמריום|Samarium|150.36|1.17;Eu|אירופיום|Europium|151.96|0;Gd|גדוליניום|Gadolinium|157.25|1.20;Tb|טרביום|Terbium|158.93|0;Dy|דיספרוסיום|Dysprosium|162.50|1.22;Ho|הולמיום|Holmium|164.93|1.23;Er|ארביום|Erb const NG=[0,2,10,18,36,54,86,118];
const ELS={}, ELIST=[];
EL_RAW.split(';').forEach((r,i)=>{
  const [sym,he,en,m,x]=r.split('|'); const Z=i+1;
  let period=1; while(Z>NG[period]) period++;
  const pos=Z-NG[period-1]; let group=null, fblock=false;
  if(period===1) group=Z===1?1:18;
  else if(period<=3) group=pos<=2?pos:pos+10;
  else if(period<=5) group=pos;
  else if(pos<=2) group=pos; else if(pos<=16) fblock=true; else if(pos===17) group=3; else group=pos-14;
  const e={sym,he,en,mass:+m,en_:+x||null,Z,period,group,fblock};
  e.block=fblock?'f':(sym==='He'||group<=2)?'s':group>=13?'p':'d';
  e.V=sym==='He'?2:fblock?null:group<=2?group:group>=13?group-10:null;
  ELS[sym]=e; ELIST.push(e);
});
function category(e){
  if(e.group===18) return 'גז אציל';
  if(e.group===17) return 'הלוגן';
  if('B Si Ge As Sb Te'.split(' ').includes(e.sym)) return 'מתכת־למחצה';
  if('H C N O P S Se'.split(' ').includes(e.sym)) return 'אל־מתכת';
  if(e.fblock) return e.period===6?'לנתניד':'אקטיניד';
  if(e.group===1) return 'מתכת אלקלית';
  if(e.group===2) return 'מתכת אלקלית־עפרורית';
  if(e.group>=3&&e.group<=12) return 'מתכת מעבר';
  return 'מתכת (קבוצה ראשית)';
}
function commonCharge(e){
  const t={Al:3,Fe:3,Cu:2,Zn:2,Ag:1,H:1,N:-3,P:-3,Pb:2,Ni:2,Co:2,Mn:2,Cr:3,Hg:2,Sn:2,Ga:3};
  if(t[e.sym]!=null) return t[e.sym];
  if(e.group===1) return 1; if(e.group===2) return 2; if(e.group===16) return -2; if(e.group===17) return -1;
  return null;
}

/* ================= Electron configuration ================= */
const AUF=['1s','2s','2p','3s','3p','4s','3d','4p','5s','4d','5p','6s','4f','5d','6p','7s','5f','6d','7p'];
const CAP={s:2,p:6,d:10,f:14}, LORD='spdf';
const EXC={24:{'4s':1,'3d':5},29:{'4s':1,'3d':10},41:{'5s':1,'4d':4},42:{'5s':1,'4d':5},44:{'5s':1,'4d':7},45:{'5s':1,'4d':8},46:{'5s':0,'4d':10},47:{'5s':1,'4d':10},57:{'4f':0,'5d':1},58:{'4f':1,'5d':1},64:{'4f':7,'5d':1},78:{'6s':1,'5d':9},79:{'6s':1,'5d':10},89:{'5f':0,'6d':1},90:{'5f':0,'6d':2},91:{'5f':2,'6d':1},92:{'5f':3,'6d':1},93:{'5f':4,'6d':1},96:{'5f':7,'6d':1}};
function aufbau(n){const c={};for(const s of AUF){if(n<=0)break;const k=Math.min(n,CAP[s[1]]);c[s]=k;n-=k;}return c;}
function config(Z,q){
  let c;
  if(q<0) c=aufbau(Z-q);
  else{
    c=aufbau(Z); if(EXC[Z]) Object.assign(c,EXC[Z]);
    for(let k=0;k<q;k++){
      let best=null;
      for(const s in c){ if(c[s]<=0) continue;
        if(!best||+s[0]>+best[0]||(+s[0]===+best[0]&&LORD.indexOf(s[1])>LORD.indexOf(best[1]))) best=s; }
      if(best) c[best]--;
    }
  }
  const list=Object.keys(c).filter(s=>c[s]>0).sort((a,b)=>(+a[0]-+b[0])||(LORD.indexOf(a[1])-LORD.indexOf(b[1]))).map(s=>[s,c[s]]);
  const shells=[]; list.forEach(([s,k])=>{const n=+s[0];shells[n-1]=(shells[n-1]||0)+k;});
  for(let i=0;i<shells.length;i++) shells[i]=shells[i]||0;

      (idx<a.lp?[-4.2,4.2]:[0]).forEach(o=>parts.push('<circle class="lw-dot" r="2.3" cx="'+(cxp+px*o).toFixed(1)+'" cy="'+(cyp+py*o).toFixed(1)+'"/>'));});

  if(!multi){
    if(!centers.length) geo.push(['מבנה מרחבי','קווי (שני אטומים)']);
    else if(centers.length===1){const c=centers[0],g=geoOf(c); if(g){geo.push(['אטום מרכזי',ltr(c.sym)+' · '+c.deg+' קשרים, '+(c.lp+c.rad)+' זוגות לא קושרים']);geo.push(['מבנה מרחבי',g[0]]);geo.push(['זווית קשר (אידיאלית)',g[1]]);if(entry.ang)geo.push(['זווית קשר מדודה',esc(entry.ang)]);geo.push(['היברידיזציה',ltr(g[2])]);if(DOMAIN[c.sn])geo.push(['סידור תחומי האלקטרונים',DOMAIN[c.sn]]);}}
    else{const seen=new Set(),li=[];centers.forEach(c=>{const g=geoOf(c),k=c.sym+c.deg+','+c.lp; if(!g||seen.has(k)||li.length>=6)return;seen.add(k);li.push('<li>סביב '+ltr(c.sym)+' ('+c.deg+' קשרים, '+(c.lp+c.rad)+' לא קושרים): '+g[0]+', '+g[1]+', '+ltr(g[2])+'</li>');}); if(li.length)geo.push(['מבנה מרחבי','<ul>'+li.join('')+'</ul>']);}
  }
  let pol=null;
  if(!multi&&!mol.charge&&A.every(a=>a.el.en_)){const mu=dipole(mol,b3.P,b3.lps),p=entry.pol||mu>.2; pol=['קוטביות',same&&!A.some(a=>a.fc)?'לא קוטבית (אטומים זהים)':p?'קוטבית (יש דיפול נטו)':'לא קוטבית (הדיפולים מתבטלים)'];}
  else if(!multi&&mol.charge) pol=['קוטביות','יון: נושא מטען נטו'];
  const bt=new Map(); mol.bonds.forEach(b=>{const x=A[b.a],y=A[b.b]; if(!x.el.en_||!y.el.en_)return; const [p,q]=x.el.en_<=y.el.en_?[x,y]:[y,x],k=p.sym+['','–','=','≡'][b.o]+q.sym; if(!bt.has(k))bt.set(k,q.el.en_-p.el.en_);});
  const btl=[...bt].slice(0,5).map(([k,d])=>'<li>'+ltr(k)+' · '+ltr('ΔEN = '+d.toFixed(2))+' · '+(d<.4?'קוולנטי לא קוטבי':d<1.8?'קוולנטי קוטבי':'יוני')+'</li>');
  const oct=[]; const seenO=new Set();
  A.forEach(a=>{ if(a.sym==='H'||a.noV||a.deg===0)return; const k=a.sym+a.around+a.rad; if(seenO.has(k))return; seenO.add(k);
    if(a.rad) oct.push('אלקטרון לא מזווג על '+ltr(a.sym)+' (רדיקל)');
    else if(a.around>8) oct.push('אוקטט מורחב על '+ltr(a.sym)+' ('+a.around+' אלקטרונים)');
    else if(a.around<8) oct.push('אוקטט חסר על '+ltr(a.sym)+' ('+a.around+' אלקטרונים)'); });
  const ions=multi?mol.comps.map(c=>{const m={atoms:c.atoms.map(k=>A[k]),charge:c.charge};return fHtml(prettyFormula(m.atoms,m.charge));}):null;
  rows([
    ['נוסחה',fHtml(entry.f||prettyFormula(mol.atoms,mol.charge))],
    entry.en?['שם באנגלית',ltr(esc(entry.en))]:null,
    entry.iupac?['שם IUPAC',ltr(esc(entry.iupac))]:null,
    ['מספר אטומים',String(A.length)],
    entry.web?['מקור הצורה המרחבית',src==='pubchem3d'?'מודל תלת־ממדי מחושב של PubChem':'מחושבת כאן לפי VSEPR (זוויות אידיאליות)']:null,
    ['מסה מולרית',ltr(mol.mass.toFixed(2)+' g/mol')],
    mol.charge?['מטען כולל',ltr(chargeStr(mol.charge))]:null,
    ions?['יונים',ions.join(' , ')]:null,
    ve!=null?['אלקטרוני ערכיות (סה"כ)',String(ve)]:null,
    ...geo, pol,
    sig?['קשרים','σ: '+sig+(pi?' · π: '+pi:'')]:null,
    btl.length?['סוג הקשרים','<ul>'+btl.join('')+'</ul>']:null,
    oct.length?['כלל האוקטט',oct.join('; ')]:(!multi&&ve!=null?['כלל האוקטט','מתקיים בכל האטומים']:null),
    entry.res?['רזוננס','יש כמה מבני לואיס שקולים. מוצג אחד מהם, והמבנה האמיתי הוא ממוצע שלהם.']:null,
    entry.exp?['הערה על המבנה','מוצג המבנה שממזער מטענים פורמליים (אוקטט מורחב). יש ספרים שמציגים מבנה ששומר על האוקטט, עם מטענים פורמליים.']:null,
    entry.st?['מצב צבירה בטמפ׳ החדר',esc(entry.st)]:null,
    temp(entry.mp,entry.mpT)?['נקודת היתוך',temp(entry.mp,entry.mpT)]:null,
    temp(entry.bp,entry.bpT)?['נקודת רתיחה',temp(entry.bp,entry.bpT)]:null
  ]);
  kick();
}

/* ---------- search flow ---------- */
const status=(t,err)=>{const s=$('status');s.textContent=t||'';s.className=err?'err':'';};
let samplePromise=null;
function getSample(){ if(!samplePromise) samplePromise=(window.claude&&window.claude.use)?window.claude.use('sample').catch(()=>null):Promise.resolve(null); return samplePromise; }
const cacheGet=k=>{try{return JSON.parse(localStorage.getItem('molsim:'+k));}catch(e){return null;}};
const cacheSet=(k,v)=>{try{localStorage.setItem('molsim:'+k,JSON.stringify(v));}catch(e){}};
async function askClaude(q){
  const key=nameKey(q), c=cacheGet(key); if(c) return c;
  const sample=await getSample(); if(!sample) return null;
  const prompt='You are a chemistry reference. A student typed this name or formula (Hebrew, English or a formula; it may be an atom, an ion, a molecule or an ionic compound): "'+q.replace(/"/g,"'")+'"\n'+
   'Reply with ONLY a JSON object, no prose: {"found":true|false,"name_he":"Hebrew name","name_en":"English name","formula":"e.g. H2O or SO4^2-","smiles":"...","state":"גז"|"נוזל"|"מוצק"|"","mp":number|null,"bp":number|null,"note":"one short Hebrew sentence about the substance"}\n'+
   'SMILES rules: the standard textbook Lewis structure; Kekule form only (no lowercase aromatic atoms); formal charges explicit in brackets like [NH4+] or [O-]; an ionic compound is written as dot-separated ions like [Na+].[Cl-]; a single atom or monatomic ion is one bracket atom like [Fe+3] or [Ar]; no stereo marks. mp and bp are in Celsius at 1 atm, null if unsure. If this is not a real, specific chemical species, set found to false.';
  const r=await sample.json(prompt,{modelTier:'default'});
  if(r&&r.found&&r.smiles) cacheSet(key,r);
  return r;
}
let DIAG=[];
async function getJSON(u,tag){const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
  try{const r=await fetch(u,{signal:c.signal}); if(!r.ok){DIAG.push(tag+'=HTTP '+r.status);return null;} const j=await r.json(); DIAG.push(tag+'=ok'); return j;}
  catch(e){DIAG.push(tag+'='+(e&&e.name==='AbortError'?'timeout':'blocked'));return null;}finally{clearTimeout(t);}}
async function heToEn(term){
  let j=await getJSON('https://he.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=langlinks&lllang=en&lllimit=1&titles='+encodeURIComponent(term),'wiki');
  const pages=j&&j.query&&j.query.pages,pg=pages&&Object.values(pages)[0],ll=pg&&pg.langlinks&&pg.langlinks[0],en=ll&&(ll['*']||ll.title);
  if(en) return {en:en.replace(/\s*\(.*\)$/,''),he:pg.title};
  j=await getJSON('https://www.wikidata.org/w/api.php?action=wbsearchentities&format=json&origin=*&language=he&uselang=en&type=item&limit=1&search='+encodeURIComponent(term),'wikidata');
  const it=j&&j.search&&j.search[0],lab=it&&((it.display&&it.display.label&&it.display.label.language==='en'&&it.display.label.value)||(/^[\x20-\x7E]+$/.test(it.label||'')&&it.label));
  return lab?{en:lab,he:term}:null;
}
async function webLookup(q){
  const key='w3:'+nameKey(q),c=cacheGet(key); if(c) return c;
  DIAG=[]; let term=clean(q),he=null;
  if(/[א-ת]/.test(term)){ const t=await heToEn(term); if(!t){DIAG.push('no-english-name');return null;} he=t.he; term=t.en; DIAG.push('en:'+term); }
  const base='https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/'; let pr=null;
  const kinds=[['name/',term]]; if(/^[A-Za-z0-9()]+$/.test(term)&&/[A-Z]/.test(term)&&/\d/.test(term)) kinds.push(['fastformula/',term]);
  outer: for(const [kind,t] of kinds) for(const prop of ['SMILES,MolecularFormula,Title,IUPACName','CanonicalSMILES,MolecularFormula,Title','IsomericSMILES,MolecularFormula,Title']){
    const j=await getJSON(base+kind+encodeURIComponent(t)+'/property/'+prop+'/JSON'+(kind==='fastformula/'?'?MaxRecords=1':''),'pubchem');
    const x=j&&j.PropertyTable&&j.PropertyTable.Properties&&j.PropertyTable.Properties[0];
    if(x&&(x.SMILES||x.CanonicalSMILES||x.ConnectivitySMILES||x.IsomericSMILES)){pr=x;break outer;}
    if(!DIAG[DIAG.length-1].endsWith('HTTP 400')) break;
  }
  if(!pr) return null;
  const sm=pr.SMILES||pr.CanonicalSMILES||pr.ConnectivitySMILES||pr.IsomericSMILES;
  const f=(pr.MolecularFormula||'').replace(/([+-])(\d*)$/,(m,sg,d)=>'^'+d+sg);
  let rec3=null,rec2=null;
  if(pr.CID){
    const [x,y]=await Promise.all([getJSON(base+'cid/'+pr.CID+'/JSON?record_type=3d','3d'),getJSON(base+'cid/'+pr.CID+'/JSON?record_type=2d','2d')]);
    const slim=j=>{const c=j&&j.PC_Compounds&&j.PC_Compounds[0]; if(!c||!c.atoms||!c.coords||!c.coords[0]||!c.coords[0].conformers) return null; const k=c.coords[0].conformers[0];
      return {atoms:c.atoms,bonds:c.bonds,coords:[{aid:c.coords[0].aid,conformers:[{x:k.x,y:k.y,z:k.z}]}]};};
    try{rec3=slim(x);}catch(e){} try{rec2=slim(y);}catch(e){}
  }
  const r={he:he||q,en:pr.Title,iupac:pr.IUPACName,f:f||undefined,s:sm,web:true,rec3,rec2}; cacheSet(key,r); return r;
}
async function run(q){
  q=q.trim(); if(!q) return;
  status(''); $('sugs').innerHTML=exampleChips();
  try{
    const hit=lookupLocal(q);
    if(hit){ hit.kind==='atom'?showAtom(hit.sym,hit.q,hit.name):showMol(hit.entry); return; }
    status('"'+q+'" לא במאגר המובנה. מחפש במאגר PubChem…');
    $('go').disabled=true;
    let r=null;
    try{
      const w=await webLookup(q);
      if(w){ showMol(w); status(''); return; }
      status('"'+q+'" לא במאגר המובנה. מחפש…');
      r=await askClaude(q);
    } finally{ $('go').disabled=false; }
    if(!r){ status('לא מצאתי את "'+q+'". נסו שם באנגלית או נוסחה, למשל H2O.'+(DIAG.length?' [אבחון: '+DIAG.join(', ')+']':''),true); return; }
    if(!r.found||!r.smiles){ status('לא זיהיתי חומר בשם "'+q+'". בדקו את האיות או נסו נוסחה.',true); return; }
    showMol({he:r.name_he||q,en:r.name_en,f:r.formula,s:r.smiles,st:r.state,mp:typeof r.mp==='number'?r.mp:null,bp:typeof r.bp==='number'?r.bp:null,note:r.note||'',ai:true});
    status('');
  }catch(e){ status('לא הצלחתי להציג את "'+q+'": '+(e&&e.message||'שגיאה')+'. נסו שם אחר.',true); }
}
const EX=['מים','CO2','אמוניה','בנזן','סולפט','נתרן','Fe3+','נתרן כלורי','SF6','אתנול'];
function exampleChips(){return '<span class="lbl">דוגמאות:</span>'+EX.map(x=>'<button type="button" class="chip" dir="auto" data-q="'+esc(x)+'">'+esc(x)+'</button>').join('');}
$('search').addEventListener('submit',e=>{e.preventDefault();run($('q').value);});
const setDir=()=>{const v=$('q').value;$('q').dir=(!v||/[\u05D0-\u05EA]/.test(v))?'rtl':'ltr';};
$('q').addEventListener('input',()=>{setDir();const s=suggest($('q').value);$('sugs').innerHTML=s.length?'<span class="lbl">במאגר:</span>'+s.map(x=>'<button type="button" class="chip" data-q="'+esc(x.q)+'">'+esc(x.label)+'</button>').join(''):exampleChips();});
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.chip[data-q]'); if(b){$('q').value=b.dataset.q;setDir();run(b.dataset.q);window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});}});
$('foot').textContent='במאגר המובנה '+DB.length+' חומרים ו־118 יסודות. הצורה המרחבית מחושבת לפי מודל VSEPR, כך שהזוויות הן הזוויות האידיאליות. חומר שאינו במאגר נשלף ממאגר PubChem ומסומן בהתאם.';
if(reduced) $('optRot').checked=false;
$('sugs').innerHTML=exampleChips();
run('מים');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(kick);
})();
